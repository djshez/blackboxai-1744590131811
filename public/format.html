<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Format CompactFlash - RAM DUMPCHIPS Utility</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-gray-50 font-['Inter']">
    <!-- Navigation -->
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between h-16">
                <div class="flex">
                    <div class="flex-shrink-0 flex items-center">
                        <i class="fas fa-microchip text-blue-600 text-2xl mr-2"></i>
                        <span class="font-bold text-xl">RAM DUMPCHIPS Utility</span>
                    </div>
                    <div class="hidden md:ml-6 md:flex md:space-x-8">
                        <a href="/" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Home</a>
                        <a href="/format.html" class="border-blue-500 text-gray-900 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Format</a>
                        <a href="/write.html" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Write</a>
                        <a href="/status.html" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Status</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
        <div class="px-4 py-6 sm:px-0">
            <div class="bg-white shadow rounded-lg p-6">
                <div class="px-4 py-5 sm:p-6">
                    <h3 class="text-lg leading-6 font-medium text-gray-900">
                        Format CompactFlash Card
                    </h3>
                    <div class="mt-2 max-w-xl text-sm text-gray-500">
                        <p>Choose the format type for your CompactFlash card. Make sure your card is properly inserted before proceeding.</p>
                    </div>
                    <form id="formatForm" class="mt-5">
                        <div class="space-y-4">
                            <div class="flex items-center">
                                <input id="fat16" name="format" type="radio" value="FAT16" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300">
                                <label for="fat16" class="ml-3">
                                    <div class="text-sm font-medium text-gray-900">FAT16</div>
                                    <p class="text-sm text-gray-500">Best for smaller cards and older systems. Maximum partition size of 2GB.</p>
                                </label>
                            </div>
                            <div class="flex items-center">
                                <input id="fat32" name="format" type="radio" value="FAT32" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300">
                                <label for="fat32" class="ml-3">
                                    <div class="text-sm font-medium text-gray-900">FAT32</div>
                                    <p class="text-sm text-gray-500">Supports larger partition sizes up to 2TB. More modern and widely compatible.</p>
                                </label>
                            </div>
                        </div>

                        <!-- Status Messages -->
                        <div id="statusMessage" class="mt-4 hidden">
                            <div class="rounded-md p-4">
                                <div class="flex">
                                    <div class="flex-shrink-0">
                                        <i class="fas fa-info-circle text-blue-400"></i>
                                    </div>
                                    <div class="ml-3">
                                        <p class="text-sm text-gray-700" id="statusText"></p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Progress Bar -->
                        <div id="progressBar" class="hidden mt-4">
                            <div class="bg-gray-200 rounded-full h-2.5">
                                <div class="bg-blue-600 h-2.5 rounded-full" style="width: 0%"></div>
                            </div>
                            <p class="text-sm text-gray-500 mt-2" id="progressText">0%</p>
                        </div>

                        <div class="mt-5">
                            <button type="submit" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                                Format Card
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('formatForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formatType = document.querySelector('input[name="format"]:checked')?.value;
            if (!formatType) {
                showStatus('Please select a format type', 'error');
                return;
            }

            const statusMsg = document.getElementById('statusMessage');
            const progressBar = document.getElementById('progressBar');
            const progressBarFill = progressBar.querySelector('div');
            const progressText = document.getElementById('progressText');

            statusMsg.classList.remove('hidden');
            progressBar.classList.remove('hidden');

            try {
                showStatus('Initializing format process...', 'info');
                updateProgress(0);

                const response = await fetch('/api/format', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ formatType }),
                });

                if (!response.ok) {
                    throw new Error('Format request failed');
                }

                // Simulate progress (in real implementation, this would be based on actual progress)
                for (let i = 0; i <= 100; i += 10) {
                    await new Promise(resolve => setTimeout(resolve, 500));
                    updateProgress(i);
                    showStatus(`Formatting in progress: ${i}%`, 'info');
                }

                showStatus('Format completed successfully!', 'success');
                setTimeout(() => {
                    window.location.href = '/write.html';
                }, 2000);

            } catch (error) {
                showStatus('Error during formatting: ' + error.message, 'error');
                updateProgress(0);
            }
        });

        function showStatus(message, type) {
            const statusMsg = document.getElementById('statusMessage');
            const statusText = document.getElementById('statusText');
            statusMsg.classList.remove('hidden');
            statusText.textContent = message;
            
            // Update status message styling based on type
            statusMsg.querySelector('div').className = 
                `rounded-md p-4 ${type === 'error' ? 'bg-red-50' : type === 'success' ? 'bg-green-50' : 'bg-blue-50'}`;
            statusMsg.querySelector('i').className = 
                `fas ${type === 'error' ? 'fa-exclamation-circle text-red-400' : type === 'success' ? 'fa-check-circle text-green-400' : 'fa-info-circle text-blue-400'}`;
        }

        function updateProgress(percent) {
            const progressBar = document.getElementById('progressBar');
            const progressBarFill = progressBar.querySelector('div');
            const progressText = document.getElementById('progressText');
            
            progressBarFill.style.width = `${percent}%`;
            progressText.textContent = `${percent}%`;
        }
    </script>
</body>
</html>
